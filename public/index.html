<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rung Chuông Vàng — TikTok Live Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: #070b14;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .studio-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 32px;
        padding: 12px 24px;
        background: #111827;
        border-bottom: 1px solid #1e293b;
        flex-shrink: 0;
      }

      .brand-wordmark {
        font-size: 17px;
        font-weight: 800;
        color: #f8fafc;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .top-nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .nav-link {
        font-size: 14px;
        font-weight: 600;
        color: #94a3b8;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
        transition: color 0.15s ease;
      }

      .nav-link:hover,
      .nav-link.active {
        color: #f8fafc;
      }

      .primary-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        min-height: 40px;
        border-radius: 8px;
        background: #f59e0b;
        color: #0b1120;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        flex-shrink: 0;
        transition: background-color 0.15s ease;
      }

      .primary-link:hover {
        background: #d97706;
      }

      .workspace-grid {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 0;
      }

      .pane {
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      .pane-admin {
        border-right: 1px solid #1e293b;
      }

      .pane-overlay {
        background: #030712;
        padding: 16px;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .overlay-caption {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 600;
        color: #94a3b8;
        padding: 0 4px;
      }

      .overlay-caption a {
        color: #fbbf24;
        text-decoration: none;
      }

      .overlay-caption a:hover {
        text-decoration: underline;
      }

      .overlay-frame-box {
        flex: 1;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .overlay-aspect {
        height: 100%;
        max-height: 100%;
        aspect-ratio: 9 / 16;
        max-width: 100%;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #1e293b;
        background: #050d22;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      @media (max-width: 1024px) {
        .studio-shell {
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }
        .workspace-grid {
          grid-template-columns: 1fr;
        }
        .pane-admin {
          height: 760px;
          border-right: 0;
          border-bottom: 1px solid #1e293b;
        }
        .pane-overlay {
          height: 720px;
        }
        .top-nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="studio-shell">
      <header class="top-bar">
        <a href="/" class="brand-wordmark">Rung Chuông Vàng</a>
        <nav class="top-nav" aria-label="Điều hướng chính">
          <a href="/" class="nav-link active">Studio tổng hợp</a>
          <a href="/admin" class="nav-link">Trang Admin</a>
          <a href="/overlay" class="nav-link">Màn hình OBS (1080×1920)</a>
        </nav>
        <a href="/overlay" class="primary-link" target="_blank" rel="noopener">Mở OBS Overlay</a>
      </header>

      <div class="workspace-grid">
        <section class="pane pane-admin" aria-label="Khu vực điều khiển Admin">
          <iframe src="/admin" title="Bảng điều khiển Admin"></iframe>
        </section>

        <section class="pane pane-overlay" aria-label="Xem trước màn hình dọc OBS">
          <div class="overlay-caption">
            <span>Xem trước OBS Overlay · 1080×1920</span>
            <a href="/overlay" target="_blank" rel="noopener">Mở toàn màn hình</a>
          </div>
          <div class="overlay-frame-box">
            <div class="overlay-aspect">
              <iframe src="/overlay" title="OBS Broadcast Overlay 1080x1920"></iframe>
            </div>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
